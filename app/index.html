<!doctype html>
<html lang="ha">
  <head>
    <base href="/app/" />
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; font-src 'self'; media-src 'self' blob:;"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1B4332" />
    <meta
      name="description"
      content="AJAMIX — Full Nigerian curriculum Nursery to SS3 in Ajami, offline-first"
    />
    <link rel="manifest" href="./manifest.json" />
    <link
      rel="preload"
      href="./fonts/NotoNaskhArabic-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>AJAMIX — Ilimi da Ajami</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="shell-header">
        <a class="brand-home" data-route="#/learning-path" href="#/learning-path" aria-label="Gida — AJAMIX">
          <p class="eyebrow">AJAMIX</p>
          <h1 class="brand-title">Ilimi da Ajami</h1>
          <p class="ajami brand-ajami">إِلِمِى دا عَجَمِى</p>
        </a>
        <div class="header-meta">
          <button id="home-btn" class="header-icon-btn" type="button"
                  data-route="#/learning-path" aria-label="Gida" title="Gida">🏠</button>
          <span id="selected-grade-chip" class="meta-chip">Foundation</span>
          <span id="connection-status" class="meta-chip is-online">Kan layi</span>
          <button id="settings-gear" class="header-icon-btn" type="button"
                  data-route="#/settings" aria-label="Saituna" title="Saituna">⚙</button>
        </div>
      </header>

      <main id="app-root" class="shell-main" aria-live="polite">
        <section class="screen loading-screen">
          <p class="eyebrow">Ana lodawa</p>
          <h2>AJAMIX yana shirya darussa a na'urar nan.</h2>
          <p>
            Manhajar tana aiki ba tare da login ba, kuma tana adana ci gaban koyo
            a wannan wayar kawai.
          </p>
        </section>
      </main>
    </div>

    <noscript>
      <div class="noscript-banner">
        Wannan manhaja tana bukatar JavaScript domin darussa da ajiyar ci gaba su
        yi aiki.
      </div>
    </noscript>

    <script defer src="/app/vendor/jszip.min.js"></script>
    <script defer src="./bootstrap.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
